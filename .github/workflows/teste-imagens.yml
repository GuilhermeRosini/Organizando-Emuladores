name: Teste de imagens (Windows)
on:
  push:
    branches: [teste-imagens]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenGL ES via ANGLE do Edge (D3D/WARP), para testar o renderizador GL
        shell: bash
        run: |
          F=$(find "/c/Program Files/Google/Chrome/Application" "/c/Program Files (x86)/Microsoft/Edge/Application" "/c/Program Files/Microsoft/Edge/Application" -iname libGLESv2.dll 2>/dev/null | head -1)
          echo "ANGLE: $F"
          D=$(dirname "$F")
          cp "$D"/libEGL.dll "$D"/libGLESv2.dll Sistema/windows/runtime/bin/
      - name: Rodar teste com o Python do runtime
        shell: cmd
        run: |
          set PATH=%CD%\Sistema\windows\runtime\bin;%PATH%
          set PYTHONHOME=
          set PYTHONPATH=
          set PYTHONUTF8=1
          set GDK_DEBUG=gl-gles
          Sistema\windows\runtime\bin\python.exe .github\teste\render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saida
          path: saida/
      - name: Guardar saida na branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -q || true; git add -f saida && git commit -m "saida do teste [skip ci]" && git push || true
