name: Teste de imagens (Windows)
on:
  push:
    branches: [teste-imagens]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenGL por software (Mesa llvmpipe), para testar o renderizador GL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R pal1000/mesa-dist-win -p "*release-msvc.7z" -O mesa.7z
          7z x -omesa mesa.7z > /dev/null
          ls mesa/x64 | head -30
          cp mesa/x64/*.dll Sistema/windows/runtime/bin/
      - name: Rodar teste com o Python do runtime
        shell: cmd
        run: |
          set PATH=%CD%\Sistema\windows\runtime\bin;%PATH%
          set PYTHONHOME=
          set PYTHONPATH=
          set PYTHONUTF8=1
          Sistema\windows\runtime\bin\python.exe .github\teste\imagens.py
          set GALLIUM_DRIVER=llvmpipe
          Sistema\windows\runtime\bin\python.exe .github\teste\plano.py
          Sistema\windows\runtime\bin\python.exe .github\teste\render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saida
          path: saida/
      - name: Guardar saida na branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -q || true; git add -f saida && git commit -m "saida do teste [skip ci]" && git push || true
