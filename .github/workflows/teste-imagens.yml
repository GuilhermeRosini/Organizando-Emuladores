name: Teste de imagens (Windows)
on:
  push:
    branches: [teste-imagens]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan por software (Mesa lavapipe), mesmo motor de desenho do GL no GTK 4.24
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R pal1000/mesa-dist-win -p "*release-msvc.7z" -O mesa.7z
          7z x -omesa mesa.7z > /dev/null
          cat mesa/x64/lvp_icd.x86_64.json
          JSON=$(cygpath -w "$PWD/mesa/x64/lvp_icd.x86_64.json")
          reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' //v "$JSON" //t REG_DWORD //d 0 //f
      - name: Rodar teste com o Python do runtime
        shell: cmd
        run: |
          set PATH=%CD%\Sistema\windows\runtime\bin;%PATH%
          set PYTHONHOME=
          set PYTHONPATH=
          set PYTHONUTF8=1
          set VK_DRIVER_FILES=%CD%\mesa\x64\lvp_icd.x86_64.json
          set VK_ICD_FILENAMES=%CD%\mesa\x64\lvp_icd.x86_64.json
          Sistema\windows\runtime\bin\python.exe .github\teste\frestas.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saida
          path: saida/
      - name: Guardar saida na branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -q || true; git add -f saida && git commit -m "saida do teste [skip ci]" && git push || true
